<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Web App</title>
    
    <!-- Подключение Telegram Web App JS SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }

        .card {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
        }

        h1 {
            font-size: 20px;
            margin-top: 0;
            color: var(--tg-theme-text-color, #000000);
        }

        .user-info {
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.5;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 id="greeting">Привет!</h1>
        
        <div class="user-info">
            <p><strong>ID:</strong> <span id="user-id">Загрузка...</span></p>
            <p><strong>Имя:</strong> <span id="user-name">Загрузка...</span></p>
            <p><strong>Username:</strong> <span id="user-username">Загрузка...</span></p>
        </div>

        <button id="send-btn">Отправить данные боту</button>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;

        // Сообщаем Telegram, что приложение готово к отображению
        tg.ready();

        // Расширяем окно на весь экран Telegram
        tg.expand();

        // Получаем данные пользователя из WebApp InitData
        const user = tg.initDataUnsafe?.user;

        if (user) {
            document.getElementById('greeting').innerText = `Привет, ${user.first_name}!`;
            document.getElementById('user-id').innerText = user.id || '—';
            document.getElementById('user-name').innerText = `${user.first_name} ${user.last_value || ''}`.trim();
            document.getElementById('user-username').innerText = user.username ? `@${user.username}` : 'Отсутствует';
        } else {
            document.getElementById('greeting').innerText = 'Привет, Гость!';
            document.getElementById('user-id').innerText = 'Не определен (открыто вне Telegram)';
            document.getElementById('user-name').innerText = 'Не определен';
            document.getElementById('user-username').innerText = 'Не определен';
        }

        // Обработка клика по кнопке
        document.getElementById('send-btn').addEventListener('click', () => {
            const data = {
                action: "button_clicked",
                timestamp: new Date().toISOString()
            };

            // Отправка данных обратно боту
            tg.sendData(JSON.stringify(data));
        });
    </script>
</body>
</html>
